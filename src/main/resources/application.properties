spring.application.name=Student-Course-Registration-System

# ---------------------------------------------------------------------
# Secrets / settings come from environment variables - never hard-code them.
# Locally they are read from .env and/or .env.local (both git-ignored,
# see .env.example). On Render, set them under "Environment".
# ---------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

# Render tells the app which port to use through the PORT variable
server.port=${PORT:8080}
# Render sits in front of the app (HTTPS proxy); trust its forwarded headers
server.forward-headers-strategy=framework

# Database: DATABASE_URL (pooled) and DATABASE_URL_UNPOOLED (direct) are read
# in config/DatabaseConfig.java. Tables are created there from schema.sql,
# so Spring's own SQL init is switched off.
spring.sql.init.mode=never

# Websites allowed to call the backend from the browser (comma separated)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://abdullah-alhar.github.io}

# Keep memory use low on Render's free plan (512 MB)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:30}

# Multipart (file upload) settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session (login) cookie: never put the session id in the URL.
# On Render set SESSION_COOKIE_SECURE=true so the cookie is only sent over HTTPS.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
