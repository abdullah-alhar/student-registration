<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Course Registration System</title>
  <meta name="description" content="Student Course Registration System: manage students, courses, registrations, payments and schedules.">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9; color: #0f172a; padding: 24px;
    }
    .card {
      width: 100%; max-width: 440px; background: #fff; border-radius: 16px;
      padding: 36px 32px; text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .sub { color: #64748b; margin: 0 0 28px; font-size: .95rem; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%;
      border: 4px solid #e2e8f0; border-top-color: #2563eb; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    #status { font-weight: 600; margin: 0 0 6px; }
    #detail { color: #64748b; font-size: .9rem; margin: 0 0 22px; min-height: 1.3em; }
    .btn {
      display: inline-block; padding: 11px 22px; border-radius: 10px; background: #2563eb;
      color: #fff; text-decoration: none; font-weight: 600;
    }
    .btn:hover { background: #1d4ed8; }
    .hidden { display: none; }
    .error .spinner { border-top-color: #dc2626; animation: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      .card { background: #1e293b; box-shadow: none; }
      .sub, #detail { color: #94a3b8; }
      .spinner { border-color: #334155; border-top-color: #3b82f6; }
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <h1>Student Course Registration System</h1>
    <p class="sub">Students · Courses · Registrations · Payments · Schedules</p>

    <div class="spinner" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite">Server is waking up, please wait...</p>
    <p id="detail">The free server sleeps when nobody uses it. This can take up to a minute.</p>

    <a id="open" class="btn hidden" href="#">Open the app</a>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      var API_URL = (window.APP_CONFIG && window.APP_CONFIG.API_URL || "").replace(/\/+$/, "");
      var statusEl = document.getElementById("status");
      var detailEl = document.getElementById("detail");
      var openBtn = document.getElementById("open");
      var card = document.getElementById("card");

      var CHECK_EVERY_MS = 3000;   // ask the server every 3 seconds
      var GIVE_UP_AFTER_MS = 120000; // stop after 2 minutes
      var started = Date.now();

      if (!API_URL || API_URL.indexOf("<") !== -1) {
        card.classList.add("error");
        statusEl.textContent = "Backend address is not set yet.";
        detailEl.textContent = "Edit frontend/config.js and set API_URL to your Render URL.";
        return;
      }

      var appUrl = API_URL + "/login";
      openBtn.href = appUrl;

      function check() {
        var controller = "AbortController" in window ? new AbortController() : null;
        var timer = controller && setTimeout(function () { controller.abort(); }, 10000);

        fetch(API_URL + "/health", { cache: "no-store", signal: controller && controller.signal })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            if (data && data.status === "UP") {
              statusEl.textContent = "Server is ready! Opening the app...";
              detailEl.textContent = "";
              openBtn.classList.remove("hidden");
              window.location.href = appUrl;
            } else {
              retry();
            }
          })
          .catch(retry)
          .finally(function () { if (timer) clearTimeout(timer); });
      }

      function retry() {
        var seconds = Math.round((Date.now() - started) / 1000);
        if (Date.now() - started > GIVE_UP_AFTER_MS) {
          card.classList.add("error");
          statusEl.textContent = "The server is taking longer than usual.";
          detailEl.textContent = "Try opening the app directly, or refresh this page in a minute.";
          openBtn.classList.remove("hidden");
          return;
        }
        detailEl.textContent = "Still waking up... (" + seconds + "s)";
        setTimeout(check, CHECK_EVERY_MS);
      }

      check();
    })();
  </script>
</body>
</html>
